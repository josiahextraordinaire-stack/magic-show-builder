<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic of Josiah — Show Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07111e;--bg2:#0c1b30;--border:#1a3060;--border2:#243f70;--gold:#c49a18;--gold2:#e8b830;--gold3:rgba(200,158,24,.14);--white:#fff;--text:#c4d4e4;--muted:#527090;--red:#e04040;--red3:rgba(224,64,64,.13);--green:#22a060;--green3:rgba(34,160,96,.13);--teal:#0890b4;--teal3:rgba(8,144,180,.13);--H:'Playfair Display',Georgia,serif;--B:'DM Sans',system-ui,sans-serif;--r:12px;--rs:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--B);min-height:100vh;}
.hdr{position:sticky;top:0;z-index:100;background:rgba(7,17,30,.97);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);height:54px;display:flex;align-items:center;padding:0 18px;}
.logo{font-family:var(--H);color:var(--gold2);font-size:1.05rem;letter-spacing:.05em;line-height:1.1;}
.logo small{display:block;font-family:var(--B);font-size:.65rem;color:var(--muted);font-weight:500;letter-spacing:.1em;text-transform:uppercase;}
.nav{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);padding:0 14px;overflow-x:auto;}
.nav-btn{padding:13px 16px 11px;font-family:var(--B);font-size:.76rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:color .2s,border-color .2s;}
.nav-btn.active{color:var(--gold2);border-bottom-color:var(--gold2);}
.nav-btn:hover:not(.active){color:var(--text);}
.main{max-width:740px;margin:0 auto;padding:22px 16px 100px;}
.ph{margin-bottom:22px;}.ph-title{font-family:var(--H);font-size:1.55rem;color:var(--gold2);}.ph-sub{font-size:.79rem;color:var(--muted);margin-top:3px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--rs);font-family:var(--B);font-size:.81rem;font-weight:600;cursor:pointer;border:none;transition:all .18s;white-space:nowrap;}
.btn-primary{background:var(--gold);color:var(--bg);}.btn-primary:hover{background:var(--gold2);}
.btn-outline{background:transparent;color:var(--gold2);border:1px solid var(--gold);}.btn-outline:hover{background:var(--gold3);}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--text);}.btn-ghost:hover{background:rgba(255,255,255,.1);}
.btn-danger{background:var(--red3);color:var(--red);border:1px solid rgba(224,64,64,.25);}.btn-danger:hover{background:rgba(224,64,64,.22);}
.btn-sm{padding:6px 11px;font-size:.74rem;}.btn-xs{padding:4px 8px;font-size:.68rem;}
.show-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:12px;cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .2s;position:relative;}
.show-card:hover{border-color:var(--gold);box-shadow:0 4px 24px rgba(200,158,24,.12);transform:translateY(-1px);}
.show-card-featured{border-color:rgba(200,158,24,.32);}
.show-card-title{font-family:var(--H);font-size:1.12rem;color:var(--gold2);margin-bottom:3px;}
.show-meta{font-size:.73rem;color:var(--muted);margin-bottom:12px;}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;}
.pill{font-size:.67rem;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,.05);color:var(--text);}
.prog-track{flex:1;height:3px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .4s;}
.prog-pct{font-size:.69rem;color:var(--muted);white-space:nowrap;}
.show-prog-row{display:flex;align-items:center;gap:10px;}
.sc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:10px;}
.sc.editing{border-color:var(--gold);box-shadow:0 0 0 1px rgba(200,158,24,.2);}
.sc-hdr{display:flex;align-items:center;gap:10px;padding:13px 15px;cursor:pointer;transition:background .15s;user-select:none;}
.sc-hdr:hover{background:rgba(255,255,255,.025);}
.sc-hdr.nc{cursor:default;}.sc-hdr.nc:hover{background:transparent;}
.sc-ico{font-size:1.15rem;width:30px;text-align:center;flex-shrink:0;}
.sc-info{flex:1;min-width:0;}
.sc-title{font-family:var(--H);font-size:.88rem;color:var(--white);font-weight:700;}
.sc-count{font-size:.69rem;color:var(--muted);margin-top:1px;}
.sc-note{font-size:.67rem;color:var(--teal);margin-top:2px;}
.chev{color:var(--muted);font-size:.7rem;transition:transform .22s;flex-shrink:0;}
.chev.open{transform:rotate(180deg);}
.sc-bar{height:2px;background:rgba(255,255,255,.05);}
.sc-fill{height:100%;background:var(--gold);transition:width .3s;}
.items{padding:5px 0 8px;}
.grp{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);padding:10px 15px 3px;}
.ci{display:flex;align-items:flex-start;gap:10px;padding:7px 15px;cursor:pointer;transition:background .12s;border-radius:6px;margin:1px 5px;}
.ci:hover{background:rgba(255,255,255,.028);}
.ci.done .ci-text{text-decoration:line-through;color:var(--muted);opacity:.55;}
.cb{width:17px;height:17px;border-radius:4px;border:2px solid #223355;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .13s;background:transparent;}
.ci.done .cb{background:var(--gold);border-color:var(--gold);}
.ck{color:var(--bg);font-size:.57rem;font-weight:900;display:none;}
.ci.done .ck{display:block;}
.cdot{width:5px;height:5px;border-radius:50%;background:var(--red);flex-shrink:0;margin-top:7px;opacity:.75;}
.ci-text{font-size:.82rem;color:var(--text);line-height:1.44;flex:1;}
.ci-warn{font-size:.67rem;color:var(--red);font-weight:600;margin-top:2px;}
.ci-note{font-size:.67rem;color:var(--teal);font-weight:500;margin-top:2px;}
.ei{display:flex;align-items:center;gap:5px;padding:4px 10px;margin:2px 5px;border-radius:6px;background:rgba(255,255,255,.02);}
.ei.eg{background:rgba(200,158,24,.06);border-left:2px solid var(--gold);}
.einput{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--border2);border-radius:6px;color:var(--white);font-family:var(--B);font-size:.8rem;padding:5px 9px;outline:none;transition:border-color .14s;min-width:0;}
.einput:focus{border-color:var(--gold);}
.ra{width:25px;height:25px;border-radius:5px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--muted);cursor:pointer;font-size:.75rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .13s;}
.ra:hover:not([disabled]){background:rgba(255,255,255,.1);color:var(--text);}
.ra[disabled]{opacity:.2;cursor:default;}
.critbtn{width:25px;height:25px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:.7rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .13s;}
.critbtn.on{color:var(--red);border-color:rgba(224,64,64,.4);background:var(--red3);}
.eadd{display:flex;gap:6px;padding:10px 15px;border-top:1px solid var(--border);margin-top:4px;}
.mtog{display:flex;align-items:center;gap:8px;padding:10px 15px;background:rgba(255,255,255,.025);border-bottom:1px solid var(--border);}
.mtog-lbl{font-size:.68rem;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;}
.mbtn{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:var(--B);font-size:.72rem;font-weight:600;cursor:pointer;transition:all .14s;}
.mbtn.on{background:var(--teal3);border-color:var(--teal);color:var(--teal);}
.tab-bar{display:flex;background:rgba(255,255,255,.04);border-radius:10px;padding:4px;gap:3px;margin-bottom:18px;}
.tab{flex:1;padding:8px 4px;border-radius:7px;border:none;font-family:var(--B);font-size:.71rem;font-weight:600;cursor:pointer;background:transparent;color:var(--muted);letter-spacing:.04em;transition:all .18s;}
.tab.active{background:var(--gold);color:var(--bg);}
.tab:hover:not(.active){background:var(--gold3);color:var(--gold2);}
.ovp{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:13px 15px;margin-bottom:14px;display:flex;align-items:center;gap:14px;}
.ovpct{font-family:var(--H);font-size:1.3rem;color:var(--gold2);white-space:nowrap;}
.ovwrap{flex:1;}.ovsub{font-size:.71rem;color:var(--muted);margin-bottom:4px;}
.timerbar{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:11px 15px;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.tdisp{font-family:'Courier New',monospace;font-size:1.1rem;color:var(--gold2);flex:1;letter-spacing:.05em;}
.tlbl{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;}
.fr{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.fc{font-size:.69rem;font-weight:600;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .14s;}
.fc.on{background:var(--gold3);border-color:var(--gold);color:var(--gold2);}
.back{background:rgba(255,255,255,.06);border:none;color:var(--muted);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:.9rem;flex-shrink:0;transition:all .15s;display:flex;align-items:center;justify-content:center;}
.back:hover{background:rgba(255,255,255,.1);color:var(--text);}
.sdh{display:flex;align-items:center;gap:11px;margin-bottom:18px;}
.sdhi{flex:1;min-width:0;}
.sdht{font-family:var(--H);font-size:1.25rem;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sdhm{font-size:.72rem;color:var(--muted);margin-top:2px;}
.sdha{display:flex;gap:6px;flex-shrink:0;}
.nw{background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:var(--rs);padding:11px;margin-bottom:14px;}
.nl{font-size:.64rem;color:var(--muted);margin-bottom:5px;letter-spacing:.08em;text-transform:uppercase;}
.nw textarea{width:100%;background:transparent;border:none;color:var(--text);font-family:var(--B);font-size:.82rem;resize:none;min-height:48px;outline:none;line-height:1.5;}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.84);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:20px 16px;overflow-y:auto;}
.md{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);width:100%;max-width:540px;overflow:hidden;margin:auto;}
.mdh{padding:18px 18px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.mdt{font-family:var(--H);font-size:1.05rem;color:var(--gold2);}
.mdc{background:rgba(255,255,255,.06);border:none;color:var(--muted);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;}
.mdc:hover{background:rgba(255,255,255,.1);color:var(--text);}
.mdb{padding:18px;}.mdf{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}
.si{font-size:.69rem;color:var(--muted);margin-bottom:14px;letter-spacing:.06em;}
.fg{margin-bottom:14px;}.fl{display:block;font-size:.7rem;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px;}
.fi{width:100%;padding:9px 13px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:var(--rs);color:var(--white);font-family:var(--B);font-size:.88rem;transition:border-color .14s;}
.fi:focus{outline:none;border-color:var(--gold);}.fi::placeholder{color:var(--muted);}
.rsel{display:flex;flex-direction:column;gap:5px;max-height:280px;overflow-y:auto;}
.ro{display:flex;align-items:center;gap:10px;padding:9px 13px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:var(--rs);cursor:pointer;transition:all .14s;}
.ro.sel{background:var(--gold3);border-color:var(--gold);}
.rocb{width:17px;height:17px;border-radius:4px;border:2px solid #223355;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .13s;}
.ro.sel .rocb{background:var(--gold);border-color:var(--gold);}
.rl{display:flex;flex-direction:column;gap:5px;}
.ri{display:flex;align-items:center;gap:8px;padding:8px 11px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:var(--rs);}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:500px){.rgrid{grid-template-columns:1fr;}}
.rc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:15px;cursor:pointer;transition:all .2s;}
.rc:hover{border-color:var(--gold);transform:translateY(-1px);}
.rci{font-size:1.65rem;margin-bottom:7px;}.rcn{font-family:var(--H);font-size:.9rem;color:var(--white);margin-bottom:3px;}.rcc{font-size:.7rem;color:var(--muted);}
.psec{margin-bottom:22px;}.psh{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.pi{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:6px;cursor:pointer;transition:all .14s;}
.pi:hover{border-color:rgba(200,158,24,.38);}
.pi.done{opacity:.4;}.pi.done .pt{text-decoration:line-through;}
.pt{flex:1;font-size:.82rem;color:var(--text);line-height:1.42;}
.ptag{font-size:.6rem;font-weight:700;letter-spacing:.07em;padding:2px 7px;border-radius:20px;flex-shrink:0;margin-top:1px;}
.tf{background:var(--red3);color:var(--red);}.tb{background:var(--green3);color:var(--green);}.tm{background:var(--teal3);color:var(--teal);}.tt{background:var(--gold3);color:var(--gold2);}
.ar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.cs{padding:9px 10px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:var(--rs);color:var(--white);font-family:var(--B);font-size:.85rem;}
.sr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:20px;}
.st{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:12px;text-align:center;}
.sv{font-family:var(--H);font-size:1.25rem;color:var(--gold2);}.sl{font-size:.67rem;color:var(--muted);margin-top:2px;}
.div{height:1px;background:var(--border);margin:14px 0;}
.f1{flex:1;}
.bdg{font-size:.64rem;font-weight:700;padding:2px 7px;border-radius:20px;flex-shrink:0;}
.bg{background:var(--gold3);color:var(--gold2);}.br{background:var(--red3);color:var(--red);}
.jsc{background:linear-gradient(135deg,rgba(200,158,24,.07),rgba(200,158,24,.02));border-color:rgba(200,158,24,.32);}
.jsc .sc-title{color:var(--gold2);}
::-webkit-scrollbar{width:5px;height:5px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
@media print{.hdr,.nav,.tab-bar,.fr,.timerbar,.btn,.sdha{display:none!important;}.items{display:block!important;}body{background:#fff;color:#000;}.sc{border:1px solid #ccc;margin-bottom:8px;}}
</style>
</head>

</nav>
<main class="main" id="main"></main>

function ls(){try{const r=localStorage.getItem('moj5');if(r){const p=JSON.parse(r);return{...IS,...p,modal:null,timer:{e:p.timer?.e||0,run:0}};}}catch(e){}return JSON.parse(JSON.stringify(IS));}

// ── ROUTINE DATA ───────────────────────────────────────────────
function addI(items,pfx){return items.map((x,i)=>({...x,_i:pfx+i+'_'+Math.random().toString(36).slice(2,6)}));}
function initRD(){const o={};Object.entries(D).forEach(([id,r])=>{o[id]={...r,setup:addI(r.setup,id+'s'),teardown:addI(r.teardown,id+'t')};});return o;}
function grd(id){if(!S.rd)S.rd=initRD();if(!S.rd[id]&&D[id]){S.rd[id]={...D[id],setup:addI(D[id].setup,id+'s'),teardown:addI(D[id].teardown,id+'t')};}return S.rd?.[id];}
function gi(id,tab){return grd(id)?.[tab]||[];}

// ── HELPERS ────────────────────────────────────────────────────
function ck(sid,tab){if(!S.chk[sid])S.chk[sid]={};if(!S.chk[sid][tab])S.chk[sid][tab]={};return S.chk[sid][tab];}
function sp(id,items,sid,tab){const c=ck(sid,tab);let d=0,t=0;items.forEach((x,i)=>{if(x.g!==undefined)return;t++;if(c[id+'-'+i])d++;});return{d,t};}
function jp(sid){return sp('bodyLoads',gi('bodyLoads','setup'),sid,'setup');}
function shp(sh,tab){if(tab==='jk'){const p=jp(sh.id);return{d:p.d,t:p.t,pct:p.t?Math.round(p.d/p.t*100):0};}let d=0,t=0;sh.ord.forEach(id=>{const r=grd(id);if(!r)return;const p=sp(id,tab==='setup'?r.setup:r.teardown,sh.id,tab);d+=p.d;t+=p.t;});return{d,t,pct:t?Math.round(d/t*100):0};}
function fmt(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function stT(){if(TI)clearInterval(TI);const b=Date.now()-S.timer.e;S.timer.run=1;TI=setInterval(()=>{S.timer.e=Date.now()-b;const el=document.getElementById('td');if(el)el.textContent=fmt(S.timer.e);},500);sv();render();}
function spT(){clearInterval(TI);TI=null;S.timer.run=0;sv();render();}
function rsT(){clearInterval(TI);TI=null;S.timer={e:0,run:0};sv();render();}
function ts(id){OS[id]=!OS[id];const el=document.getElementById('it'+id);const cv=document.getElementById('cv'+id);if(el)el.style.display=OS[id]?'block':'none';if(cv)cv.className='chev'+(OS[id]?' open':'');}
function sam(m){S.am=m;sv();const mt=document.getElementById('mgt');if(mt)mt.innerHTML=mth();const el=document.getElementById('ittables');if(el){if(S.ed['tables'+(S.stab||'setup')])el.innerHTML=rEI('tables',S.stab||'setup');else el.innerHTML=rNI('tables',S.stab||'setup',S.ashow);}}
function mth(){return`<div class="mtog"><span class="mtog-lbl">Audio Ape:</span><div style="display:flex;gap:4px"><button class="mbtn${S.am==='phone'?' on':''}" onclick="sam('phone')">📱 Phone</button><button class="mbtn${S.am==='mac'?' on':''}" onclick="sam('mac')">💻 MacBook</button></div></div>`;}
function fi(x){if(x.m&&x.m!==S.am)return 0;if(S.flt==='crit'&&x.g===undefined&&!x.c)return 0;return 1;}

// ── EDIT ───────────────────────────────────────────────────────
function syn(id,tab){const items=gi(id,tab);items.forEach((x,i)=>{const el=document.querySelector(`[data-r="${id}"][data-t="${tab}"][data-i="${i}"]`);if(el){if(x.g!==undefined)x.g=el.value;else x.t=el.value;}});}
function se(id,tab){OS[id]=1;S.ed[id+tab]=1;const el=document.getElementById('it'+id);const cv=document.getElementById('cv'+id);if(el)el.innerHTML=rEI(id,tab);if(cv)cv.className='chev open';const hd=document.getElementById('hd'+id);if(hd)hd.outerHTML=rHdr(id,tab,1);}
function de(id,tab){syn(id,tab);S.ed[id+tab]=0;sv();render();}
function rr(id,tab){if(!confirm('Reset to default? Your edits will be lost.'))return;if(!S.rd)S.rd=initRD();S.rd[id][tab]=addI(D[id][tab],id+(tab==='setup'?'s':'t'));S.ed[id+tab]=0;sv();render();}
function mv(id,tab,i,d){syn(id,tab);const items=gi(id,tab);const ni=i+d;if(ni<0||ni>=items.length)return;[items[i],items[ni]]=[items[ni],items[i]];sv();const el=document.getElementById('it'+id);if(el)el.innerHTML=rEI(id,tab);}
function di(id,tab,i){syn(id,tab);gi(id,tab).splice(i,1);sv();const el=document.getElementById('it'+id);if(el)el.innerHTML=rEI(id,tab);}
function ai(id,tab,isG){syn(id,tab);const items=gi(id,tab);items.push(isG?{g:'New Group',_i:'ng'+Date.now()}:{t:'New item',_i:'ni'+Date.now()});sv();const el=document.getElementById('it'+id);if(el){el.innerHTML=rEI(id,tab);setTimeout(()=>{const ins=el.querySelectorAll('.einput');if(ins.length)ins[ins.length-1].focus();},30);}}
function tc(id,tab,i){syn(id,tab);const items=gi(id,tab);if(items[i])items[i].c=!items[i].c;sv();const el=document.getElementById('it'+id);if(el)el.innerHTML=rEI(id,tab);}

// ── RENDER ITEMS ───────────────────────────────────────────────
function rNI(id,tab,sid){
 const items=gi(id,tab);const c=sid?ck(sid,tab):{};let h='';
 if(id==='tables')h+=`<div id="mgt">${mth()}</div>`;
 items.forEach((x,i)=>{
  if(!fi(x))return;
  if(x.g!==undefined){h+=`<div class="grp">${x.g||'&nbsp;'}</div>`;return;}
  const k=id+'-'+i,done=!!(c[k]);
  h+=`<div class="ci${done?' done':''}"${sid?` onclick="dc('${sid}','${tab}','${k}')"`:''}><div class="cb"><span class="ck">✓</span></div>${x.c?'<div class="cdot"></div>':''}<div class="f1"><div class="ci-text">${x.t||''}</div>${x.w?`<div class="ci-warn">${x.w}</div>`:''}${x.n?`<div class="ci-note">ℹ ${x.n}</div>`:''}</div></div>`;
 });
 return h;
}
function rEI(id,tab){
 const items=gi(id,tab);let h='';
 if(id==='tables')h+=`<div id="mgt">${mth()}</div>`;
 items.forEach((x,i)=>{
  const isG=x.g!==undefined,val=isG?x.g:x.t;
  h+=`<div class="ei${isG?' eg':''}"><button class="ra" ${i===0?'disabled':''} onclick="mv('${id}','${tab}',${i},-1)">↑</button><button class="ra" ${i===items.length-1?'disabled':''} onclick="mv('${id}','${tab}',${i},1)">↓</button><input class="einput" data-r="${id}" data-t="${tab}" data-i="${i}" value="${(val||'').replace(/"/g,'&quot;')}" placeholder="${isG?'Group name':'Item text'}">${!isG?`<button class="critbtn${x.c?' on':''}" onclick="tc('${id}','${tab}',${i})" title="Critical">⚠</button>`:'<div style="width:25px"></div>'}<button class="ra" style="color:var(--red);border-color:rgba(224,64,64,.3)" onclick="di('${id}','${tab}',${i})">✕</button></div>`;
 });
 h+=`<div class="eadd"><button class="btn btn-ghost btn-sm" onclick="ai('${id}','${tab}',0)">＋ Item</button><button class="btn btn-ghost btn-sm" onclick="ai('${id}','${tab}',1)">＋ Group</button></div>`;
 return h;
}

function rHdr(id,tab,isE){
 const r=grd(id);if(!r)return'';
 const items=gi(id,tab);const{d,t}=sp(id,items,S.ashow,tab);const pct=t?Math.round(d/t*100):0;const isO=!!OS[id];
 const note=r.note?`<div class="sc-note">↳ ${r.note}</div>`:'';
 if(isE)return`<div class="sc-hdr nc" id="hd${id}"><div class="sc-ico">${r.icon}</div><div class="sc-info"><div class="sc-title" style="color:var(--gold2)">${r.name}</div><div class="sc-count" style="color:var(--gold)">✏ EDITING</div></div><button class="btn btn-ghost btn-xs" onclick="rr('${id}','${tab}')">↺ Reset</button><button class="btn btn-primary btn-xs" onclick="de('${id}','${tab}')">✓ Done</button></div>`;
 return`<div class="sc-hdr" id="hd${id}" onclick="ts('${id}')"><div class="sc-ico">${r.icon}</div><div class="sc-info"><div class="sc-title">${r.name}</div><div class="sc-count">${d}/${t} complete</div>${note}</div>${S.view==='show-detail'?`<span class="bdg ${pct===100&&t>0?'bg':'br'}">${pct}%</span>`:''}<button class="btn btn-ghost btn-xs" style="margin-left:4px" onclick="event.stopPropagation();se('${id}','${tab}')">✏</button><div class="chev${isO?' open':''}" id="cv${id}">▼</div></div>`;
}

function rSec(id,tab,sid){
 const r=grd(id);if(!r)return'';
 const items=gi(id,tab);const{d,t}=sp(id,items,sid,tab);const pct=t?Math.round(d/t*100):0;const isO=!!OS[id];const isE=S.ed[id+tab];
 return`<div class="sc${isE?' editing':''}">
  ${rHdr(id,tab,isE)}
  <div class="sc-bar"><div class="sc-fill" style="width:${pct}%"></div></div>
  <div class="items" id="it${id}" style="display:${isO||isE?'block':'none'}">${isE?rEI(id,tab):rNI(id,tab,sid)}</div>
 </div>`;
}

 const flt=tab!=='jk'?`<div class="fr"><button class="fc${S.flt==='all'?' on':''}" onclick="sf('all')">All Items</button><button class="fc${S.flt==='crit'?' on':''}" onclick="sf('crit')">🔴 Critical Only</button></div>`:'';

 const cards=Object.values(D).map(r=>`<div class="rc" onclick="S.arou='${r.id}';S.rvt='setup';OS={};render()"><div class="rci">${r.icon}</div><div class="rcn">${r.name}</div><div class="rcc">${gi(r.id,'setup').filter(x=>x.g===undefined).length} setup · ${gi(r.id,'teardown').filter(x=>x.g===undefined).length} teardown</div></div>`).join('');
 return`<div class="ph"><div class="ph-title">Routines Library</div><div class="ph-sub">Tap any routine to view or edit. Changes apply across all shows.</div></div>
 <div class="rgrid">${cards}<div class="rc" style="border-color:rgba(200,158,24,.3)" onclick="S.arou='bodyLoads';S.rvt='setup';OS={};render()"><div class="rci">🌴</div><div class="rcn" style="color:var(--gold2)">Body Loads — Final Check</div><div class="rcc">${gi('bodyLoads','setup').filter(x=>x.g===undefined).length} items · editable pre-show check</div></div></div>`;
}

function vPrep(){
 const cats={find:{l:'🔍 FIND',cls:'tf'},buy:{l:'🛒 BUY',cls:'tb'},make:{l:'🔧 MAKE / FIX / PREP',cls:'tm'},time:{l:'⏳ IF TIME ALLOWS',cls:'tt'}};
 const done=S.prep.filter(p=>p.d).length;const pct=S.prep.length?Math.round(done/S.prep.length*100):0;
 const secs=Object.entries(cats).map(([k,{l,cls}])=>{
  const items=S.prep.filter(p=>p.k===k);if(!items.length)return'';
  return`<div class="psec"><div class="psh">${l}</div>${items.map(p=>`<div class="pi${p.d?' done':''}" onclick="tp('${p.id}')"><div class="cb" style="flex-shrink:0;margin-top:2px"><span class="ck">✓</span></div><div class="pt">${p.x}</div><span class="ptag ${cls}">${k==='time'?'TIME':k.toUpperCase()}</span><button class="btn btn-danger btn-xs" style="margin-left:6px;flex-shrink:0" onclick="event.stopPropagation();dp('${p.id}')">✕</button></div>`).join('')}</div>`;
 }).join('');
 return`<div class="ph"><div class="ph-title">Show Preparation</div><div class="ph-sub">Illusion Magic Lounge Prep — ${done} of ${S.prep.length} resolved</div></div>
 <div class="ovp" style="margin-bottom:20px"><div class="ovpct">${pct}%</div><div class="ovwrap"><div class="ovsub">${done}/${S.prep.length} complete</div><div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div></div></div>
 ${secs}<div class="div"></div>
 <div class="psh" style="margin-bottom:8px">ADD NEW ITEM</div>
 <div class="fg"><input class="fi" id="npt" placeholder="New prep item..." value="${(S.np.x||'').replace(/"/g,'&quot;')}" oninput="S.np.x=this.value" onkeydown="if(event.key==='Enter')ap()"></div>
 <div class="ar"><select class="fi cs" style="width:auto" onchange="S.np.k=this.value"><option value="find"${S.np.k==='find'?' selected':''}>Find</option><option value="buy"${S.np.k==='buy'?' selected':''}>Buy</option><option value="make"${S.np.k==='make'?' selected':''}>Make/Fix/Prep</option><option value="time"${S.np.k==='time'?' selected':''}>If Time Allows</option></select><button class="btn btn-primary" onclick="ap()">Add Item</button></div>`;
}

function rMod(){
 if(S.modal!=='ns')return'';
 const ns=S.ns,step=ns.step;let body='',nl='',bl='';
 if(step===1){nl='Next: Select Routines →';bl='Cancel';
  body=`<div class="si">Step 1 of 3 — Show Info</div><div class="fg"><label class="fl">Show Name *</label><input class="fi" placeholder="e.g. Corporate Gala..." value="${ns.name.replace(/"/g,'&quot;')}" oninput="S.ns.name=this.value"></div><div class="fg"><label class="fl">Venue (optional)</label><input class="fi" placeholder="e.g. The Marriott" value="${ns.venue.replace(/"/g,'&quot;')}" oninput="S.ns.venue=this.value"></div><div class="fg"><label class="fl">Date (optional)</label><input class="fi" type="date" value="${ns.date}" oninput="S.ns.date=this.value"></div>`;
 }else if(step===2){nl='Next: Arrange Order →';bl='← Back';
  const opts=Object.values(D).map(r=>`<div class="ro${ns.sel.includes(r.id)?' sel':''}" onclick="nt('${r.id}')"><div class="rocb"><span class="ck" style="${ns.sel.includes(r.id)?'display:block':'display:none'}">✓</span></div><span style="font-size:.95rem">${r.icon}</span><span style="font-size:.83rem;color:var(--text)">${r.name}</span></div>`).join('');
  body=`<div class="si">Step 2 of 3 — Select Routines (${ns.sel.length} selected)</div><div class="rsel">${opts}</div>`;
 }else{nl='✦ Create Show';bl='← Back';
  const ord=ns.ord.filter(id=>ns.sel.includes(id));
  const rh=ord.map((id,i)=>{const r=grd(id)||D[id];return`<div class="ri"><span>${r.icon}</span><span style="flex:1;font-size:.82rem">${r.name}</span><button class="ra" ${i===0?'disabled':''} onclick="nm('${id}',-1)">↑</button><button class="ra" ${i===ord.length-1?'disabled':''} onclick="nm('${id}',1)">↓</button></div>`;}).join('');
  body=`<div class="si">Step 3 of 3 — Arrange Performance Order</div><div class="rl">${rh}</div>`;
 }
 return`<div class="ov" onclick="if(event.target===this)cm()"><div class="md"><div class="mdh"><div class="mdt">✦ Build New Show</div><button class="mdc" onclick="cm()">✕</button></div><div class="mdb">${body}</div><div class="mdf"><button class="btn btn-ghost" onclick="nb()">${bl}</button><button class="btn btn-primary" onclick="nn()">${nl}</button></div></div></div>`;
}

// ── ACTIONS ────────────────────────────────────────────────────
function dc(sid,tab,key){const c=ck(sid,tab);c[key]=!c[key];sv();const el=document.querySelector(`[onclick*="'${key}'"]`);if(el&&el.classList.contains('ci')){el.classList.toggle('done',c[key]);const cb=el.querySelector('.cb');if(cb){const ck2=cb.querySelector('.ck');if(ck2)ck2.style.display=c[key]?'block':'none';}}}
function gn(v){S.view=v;S.arou=null;OS={};S.ed={};sv();render();}
function os(id){S.ashow=id;S.view='show-detail';S.stab='setup';OS={};S.ed={};render();}
function st(t){S.stab=t;OS={};S.ed={};render();}
function sf(f){S.flt=f;render();}
function sn(sid,val){S.notes[sid]=val;sv();}
function rc(sid){if(confirm('Reset all checks for this show?')){S.chk[sid]={};sv();render();}}
function dsw(id){if(confirm('Delete this show?')){S.shows=S.shows.filter(s=>s.id!==id);if(S.ashow===id){S.view='shows';S.ashow=null;}sv();render();}}
function tp(id){const p=S.prep.find(x=>x.id===id);if(p){p.d=!p.d;sv();render();}}
function dp(id){S.prep=S.prep.filter(x=>x.id!==id);sv();render();}
function ap(){const x=(S.np.x||'').trim();if(!x)return;S.prep.push({id:'p'+Date.now(),x,k:S.np.k||'find',d:0});S.np.x='';sv();render();}
function om(){S.modal='ns';S.ns={step:1,name:'',venue:'',date:'',sel:[...DORD],ord:[...DORD]};render();}
function cm(){S.modal=null;render();}
function nt(id){const ns=S.ns;if(ns.sel.includes(id)){ns.sel=ns.sel.filter(x=>x!==id);ns.ord=ns.ord.filter(x=>x!==id);}else{ns.sel.push(id);if(!ns.ord.includes(id))ns.ord.push(id);}render();}
function nm(id,dir){const o=S.ns.ord,i=o.indexOf(id),ni=i+dir;if(ni<0||ni>=o.length)return;[o[i],o[ni]]=[o[ni],o[i]];render();}
function nn(){const ns=S.ns;if(ns.step===1){if(!ns.name.trim()){alert('Please enter a show name.');return;}ns.step=2;render();}else if(ns.step===2){if(!ns.sel.length){alert('Select at least one routine.');return;}ns.ord=ns.ord.filter(id=>ns.sel.includes(id));ns.sel.forEach(id=>{if(!ns.ord.includes(id))ns.ord.push(id);});ns.step=3;render();}else{const sh={id:'sh'+Date.now(),name:ns.name,venue:ns.venue,date:ns.date,ord:ns.ord.filter(id=>ns.sel.includes(id)),feat:0};S.shows.push(sh);cm();os(sh.id);sv();}}
function nb(){if(S.ns.step===1)cm();else{S.ns.step--;render();}}

// ── RENDER ─────────────────────────────────────────────────────
function render(){
 document.querySelectorAll('.nav-btn').forEach(b=>{const v=b.dataset.v;b.classList.toggle('active',(v==='shows'&&(S.view==='shows'||S.view==='show-detail'))||(v==='routines'&&S.view==='routines')||(v==='prep'&&S.view==='prep'));});
 const m=document.getElementById('main');
 if(S.view==='shows')m.innerHTML=vShows();
 else if(S.view==='show-detail')m.innerHTML=vSD();
 else if(S.view==='routines')m.innerHTML=vRou();
 else if(S.view==='prep')m.innerHTML=vPrep();
 document.getElementById('mroot').innerHTML=rMod();
}
render();
</script>
</body>
</html>
