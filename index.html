<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic of Josiah — Show Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07111e;--bg2:#0c1b30;--bg3:#102040;
  --border:#1a3060;--border2:#243f70;
  --gold:#c49a18;--gold2:#e8b830;--gold3:rgba(200,158,24,.14);
  --white:#fff;--text:#c4d4e4;--muted:#527090;
  --red:#e04040;--red3:rgba(224,64,64,.13);
  --green:#22a060;--green3:rgba(34,160,96,.13);
  --teal:#0890b4;--teal3:rgba(8,144,180,.13);
  --H:'Playfair Display',Georgia,serif;--B:'DM Sans',system-ui,sans-serif;
  --r:12px;--rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--B);min-height:100vh;}
.hdr{position:sticky;top:0;z-index:100;background:rgba(7,17,30,.97);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;}
.logo{font-family:var(--H);color:var(--gold2);font-size:1.05rem;letter-spacing:.05em;line-height:1.1;}
.logo small{display:block;font-family:var(--B);font-size:.65rem;color:var(--muted);font-weight:500;letter-spacing:.1em;text-transform:uppercase;}
.nav{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);padding:0 14px;overflow-x:auto;}
.nav-btn{padding:13px 16px 11px;font-family:var(--B);font-size:.76rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:color .2s,border-color .2s;}
.nav-btn.active{color:var(--gold2);border-bottom-color:var(--gold2);}
.nav-btn:hover:not(.active){color:var(--text);}
.main{max-width:740px;margin:0 auto;padding:22px 16px 100px;}
.ph{margin-bottom:22px;}
.ph-title{font-family:var(--H);font-size:1.55rem;color:var(--gold2);line-height:1.2;}
.ph-sub{font-size:.79rem;color:var(--muted);margin-top:3px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--rs);font-family:var(--B);font-size:.81rem;font-weight:600;cursor:pointer;border:none;transition:all .18s;letter-spacing:.02em;white-space:nowrap;}
.btn-primary{background:var(--gold);color:var(--bg);}
.btn-primary:hover{background:var(--gold2);}
.btn-outline{background:transparent;color:var(--gold2);border:1px solid var(--gold);}
.btn-outline:hover{background:var(--gold3);}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--text);}
.btn-ghost:hover{background:rgba(255,255,255,.1);}
.btn-danger{background:var(--red3);color:var(--red);border:1px solid rgba(224,64,64,.25);}
.btn-danger:hover{background:rgba(224,64,64,.22);}
.btn-sm{padding:6px 11px;font-size:.74rem;}
.btn-xs{padding:4px 8px;font-size:.68rem;}
.show-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:12px;cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .2s;position:relative;}
.show-card:hover{border-color:var(--gold);box-shadow:0 4px 24px rgba(200,158,24,.12);transform:translateY(-1px);}
.show-card-featured{border-color:rgba(200,158,24,.32);}
.show-card-title{font-family:var(--H);font-size:1.12rem;color:var(--gold2);margin-bottom:3px;}
.show-meta{font-size:.73rem;color:var(--muted);margin-bottom:12px;}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;}
.pill{font-size:.67rem;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,.05);color:var(--text);}
.show-prog-row{display:flex;align-items:center;gap:10px;}
.prog-track{flex:1;height:3px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .4s;}
.prog-pct{font-size:.69rem;color:var(--muted);white-space:nowrap;}
.sc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:10px;}
.sc-hdr{display:flex;align-items:center;gap:10px;padding:13px 15px;cursor:pointer;transition:background .15s;user-select:none;}
.sc-hdr:hover{background:rgba(255,255,255,.025);}
.sc-ico{font-size:1.15rem;width:30px;text-align:center;flex-shrink:0;}
.sc-info{flex:1;min-width:0;}
.sc-title{font-family:var(--H);font-size:.88rem;color:var(--white);font-weight:700;}
.sc-count{font-size:.69rem;color:var(--muted);margin-top:1px;}
.sc-note{font-size:.67rem;color:var(--teal);margin-top:2px;}
.chev{color:var(--muted);font-size:.7rem;transition:transform .22s;flex-shrink:0;margin-left:4px;}
.chev.open{transform:rotate(180deg);}
.sc-bar{height:2px;background:rgba(255,255,255,.05);}
.sc-fill{height:100%;background:var(--gold);transition:width .3s;}
.items{padding:5px 0 8px;}
.grp{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);padding:10px 15px 3px;}
.ci{display:flex;align-items:flex-start;gap:10px;padding:7px 15px;cursor:pointer;transition:background .12s;border-radius:6px;margin:1px 5px;}
.ci:hover{background:rgba(255,255,255,.028);}
.ci.done .ci-text{text-decoration:line-through;color:var(--muted);opacity:.55;}
.cb{width:17px;height:17px;border-radius:4px;border:2px solid #223355;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .13s;background:transparent;}
.ci.done .cb{background:var(--gold);border-color:var(--gold);}
.ck{color:var(--bg);font-size:.57rem;font-weight:900;display:none;}
.ci.done .ck{display:block;}
.cdot{width:5px;height:5px;border-radius:50%;background:var(--red);flex-shrink:0;margin-top:7px;opacity:.75;}
.ci-text{font-size:.82rem;color:var(--text);line-height:1.44;flex:1;}
.ci-warn{font-size:.67rem;color:var(--red);font-weight:600;margin-top:2px;}
.ci-note{font-size:.67rem;color:var(--teal);font-weight:500;margin-top:2px;}
.sc-jacket{background:linear-gradient(135deg,rgba(200,158,24,.07),rgba(200,158,24,.02));border-color:rgba(200,158,24,.32);}
.sc-jacket .sc-title{color:var(--gold2);}
.tab-bar{display:flex;background:rgba(255,255,255,.04);border-radius:10px;padding:4px;gap:3px;margin-bottom:18px;}
.tab{flex:1;padding:8px 4px;border-radius:7px;border:none;font-family:var(--B);font-size:.71rem;font-weight:600;cursor:pointer;background:transparent;color:var(--muted);letter-spacing:.04em;transition:all .18s;}
.tab.active{background:var(--gold);color:var(--bg);}
.tab:hover:not(.active){background:var(--gold3);color:var(--gold2);}
.ov-prog{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:13px 15px;margin-bottom:14px;display:flex;align-items:center;gap:14px;}
.ov-pct{font-family:var(--H);font-size:1.3rem;color:var(--gold2);white-space:nowrap;}
.ov-wrap{flex:1;}
.ov-sub{font-size:.71rem;color:var(--muted);margin-bottom:4px;}
.timer-bar{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:11px 15px;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.timer-disp{font-family:'Courier New',monospace;font-size:1.1rem;color:var(--gold2);flex:1;letter-spacing:.05em;}
.timer-label{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;}
.filter-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.fchip{font-size:.69rem;font-weight:600;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .14s;}
.fchip.active{background:var(--gold3);border-color:var(--gold);color:var(--gold2);}
.back-btn{background:rgba(255,255,255,.06);border:none;color:var(--muted);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:.9rem;flex-shrink:0;transition:all .15s;display:flex;align-items:center;justify-content:center;}
.back-btn:hover{background:rgba(255,255,255,.1);color:var(--text);}
.sdh{display:flex;align-items:center;gap:11px;margin-bottom:18px;}
.sdh-info{flex:1;min-width:0;}
.sdh-title{font-family:var(--H);font-size:1.25rem;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sdh-meta{font-size:.72rem;color:var(--muted);margin-top:2px;}
.sdh-actions{display:flex;gap:6px;flex-shrink:0;}
.note-wrap{background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:var(--rs);padding:11px;margin-bottom:14px;}
.note-lbl{font-size:.64rem;color:var(--muted);margin-bottom:5px;letter-spacing:.08em;text-transform:uppercase;}
.note-wrap textarea{width:100%;background:transparent;border:none;color:var(--text);font-family:var(--B);font-size:.82rem;resize:none;min-height:48px;outline:none;line-height:1.5;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.84);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:20px 16px;overflow-y:auto;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);width:100%;max-width:540px;overflow:hidden;margin:auto;}
.modal-hdr{padding:18px 18px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-family:var(--H);font-size:1.05rem;color:var(--gold2);}
.modal-close{background:rgba(255,255,255,.06);border:none;color:var(--muted);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;}
.modal-close:hover{background:rgba(255,255,255,.1);color:var(--text);}
.modal-body{padding:18px;}
.modal-footer{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}
.step-ind{font-size:.69rem;color:var(--muted);margin-bottom:14px;letter-spacing:.06em;}
.fg{margin-bottom:14px;}
.flbl{display:block;font-size:.7rem;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px;}
.finput{width:100%;padding:9px 13px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:var(--rs);color:var(--white);font-family:var(--B);font-size:.88rem;transition:border-color .14s;}
.finput:focus{outline:none;border-color:var(--gold);}
.finput::placeholder{color:var(--muted);}
.rselector{display:flex;flex-direction:column;gap:5px;max-height:280px;overflow-y:auto;}
.roption{display:flex;align-items:center;gap:10px;padding:9px 13px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:var(--rs);cursor:pointer;transition:all .14s;}
.roption.sel{background:var(--gold3);border-color:var(--gold);}
.roption-cb{width:17px;height:17px;border-radius:4px;border:2px solid #223355;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .13s;}
.roption.sel .roption-cb{background:var(--gold);border-color:var(--gold);}
.roption-ico{font-size:.95rem;flex-shrink:0;}
.roption-name{font-size:.83rem;color:var(--text);}
.rlist{display:flex;flex-direction:column;gap:5px;}
.ritem{display:flex;align-items:center;gap:8px;padding:8px 11px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:var(--rs);}
.ritem-name{flex:1;font-size:.82rem;}
.rarrow{width:27px;height:27px;border-radius:5px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--muted);cursor:pointer;font-size:.8rem;display:flex;align-items:center;justify-content:center;transition:all .13s;}
.rarrow:hover:not([disabled]){background:rgba(255,255,255,.08);color:var(--text);}
.rarrow[disabled]{opacity:.22;cursor:default;}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:500px){.rgrid{grid-template-columns:1fr;}}
.rcard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:15px;cursor:pointer;transition:all .2s;}
.rcard:hover{border-color:var(--gold);transform:translateY(-1px);}
.rcard-ico{font-size:1.65rem;margin-bottom:7px;}
.rcard-name{font-family:var(--H);font-size:.9rem;color:var(--white);margin-bottom:3px;}
.rcard-cnt{font-size:.7rem;color:var(--muted);}
.prep-sec{margin-bottom:22px;}
.prep-sec-hdr{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.prep-item{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:6px;cursor:pointer;transition:all .14s;}
.prep-item:hover{border-color:rgba(200,158,24,.38);}
.prep-item.done{opacity:.4;}
.prep-item.done .prep-text{text-decoration:line-through;}
.prep-text{flex:1;font-size:.82rem;color:var(--text);line-height:1.42;}
.ptag{font-size:.6rem;font-weight:700;letter-spacing:.07em;padding:2px 7px;border-radius:20px;flex-shrink:0;margin-top:1px;}
.tag-find{background:var(--red3);color:var(--red);}
.tag-buy{background:var(--green3);color:var(--green);}
.tag-make{background:var(--teal3);color:var(--teal);}
.tag-time{background:var(--gold3);color:var(--gold2);}
.add-row{display:flex;gap:8px;flex-wrap:wrap;}
.cat-sel{padding:9px 10px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:var(--rs);color:var(--white);font-family:var(--B);font-size:.85rem;}
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:20px;}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:12px;text-align:center;}
.stat-val{font-family:var(--H);font-size:1.25rem;color:var(--gold2);}
.stat-lbl{font-size:.67rem;color:var(--muted);margin-top:2px;}
.divider{height:1px;background:var(--border);margin:14px 0;}
.flex-1{flex:1;}
.badge{font-size:.64rem;font-weight:700;padding:2px 7px;border-radius:20px;flex-shrink:0;}
.badge-gold{background:var(--gold3);color:var(--gold2);}
.badge-red{background:var(--red3);color:var(--red);}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
@media print{
  .hdr,.nav,.tab-bar,.filter-row,.timer-bar,.btn,.sdh-actions{display:none!important;}
  .items{display:block!important;}
  body{background:#fff;color:#000;}
  .sc{border:1px solid #ccc;margin-bottom:8px;}
}
</style>
</head>

  <button class="nav-btn" data-v="prep" onclick="goNav('prep')">📋 Prep</button>
</nav>
<main class="main" id="main"></main>
<div id="mroot"></div>

let S=loadState();

function loadState(){
  try{
    const raw=localStorage.getItem('moj3');
    if(raw){const p=JSON.parse(raw);return{...INIT_STATE,...p,modal:null,timer:{elapsed:p.timer?.elapsed||0,running:false}};}
  }catch(e){}
  return JSON.parse(JSON.stringify(INIT_STATE));
}
function save(){try{localStorage.setItem('moj3',JSON.stringify({...S,modal:null}));}catch(e){}}

// ================================================================
// HELPERS
// ================================================================
function chks(sid,tab){
  if(!S.checks[sid])S.checks[sid]={};
  if(!S.checks[sid][tab])S.checks[sid][tab]={};
  return S.checks[sid][tab];
}
function secProg(rid,items,sid,tab){
  const c=chks(sid,tab);let done=0,total=0;
  items.forEach((item,i)=>{if(item.g)return;total++;if(c[rid+'-'+i])done++;});
  return{done,total};
}
function jacketProg(sid){
  const c=chks(sid,'jacket');
  return{done:JACKET_ITEMS.filter((_,i)=>c['j-'+i]).length,total:JACKET_ITEMS.length};
}
function showProg(show,tab){
  if(tab==='jacket')return{...jacketProg(show.id),pct:0};
  let done=0,total=0;
  show.routineOrder.forEach(rid=>{
    const r=RD[rid];if(!r)return;
    const p=secProg(rid,tab==='setup'?r.setup:r.teardown,show.id,tab);
    done+=p.done;total+=p.total;
  });
  const pct=total?Math.round(done/total*100):0;
  return{done,total,pct};
}
function fmt(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function startTimer(){
  if(timerInt)clearInterval(timerInt);
  const base=Date.now()-S.timer.elapsed;
  S.timer.running=true;
  timerInt=setInterval(()=>{S.timer.elapsed=Date.now()-base;const el=document.getElementById('tdisp');if(el)el.textContent=fmt(S.timer.elapsed);},500);
  save();render();
}
function stopTimer(){clearInterval(timerInt);timerInt=null;S.timer.running=false;save();render();}
function resetTimer(){clearInterval(timerInt);timerInt=null;S.timer={elapsed:0,running:false};save();render();}
function toggleSec(id){
  openSec[id]=!openSec[id];
  const el=document.getElementById('it-'+id);
  const cv=document.getElementById('cv-'+id);
  if(el)el.style.display=openSec[id]?'block':'none';
  if(cv)cv.className='chev'+(openSec[id]?' open':'');
}

// ================================================================
// RENDER HELPERS
// ================================================================
function rSec(rid,items,sid,tab){
  const r=RD[rid];if(!r)return'';
  const{done,total}=secProg(rid,items,sid,tab);
  const pct=total?Math.round(done/total*100):0;
  const isOpen=!!openSec[rid];
  const c=chks(sid,tab);
  const ihtml=items.map((item,i)=>{
    if(item.g)return`<div class="grp">${item.g}</div>`;
    if(S.filter==='critical'&&!item.c)return'';
    const key=rid+'-'+i,isDone=!!c[key];
    return`<div class="ci${isDone?' done':''}" onclick="doCheck('${sid}','${tab}','${key}')">
      <div class="cb"><span class="ck">✓</span></div>
      ${item.c?'<div class="cdot"></div>':''}
      <div class="flex-1">
        <div class="ci-text">${item.t}</div>
        ${item.w?`<div class="ci-warn">${item.w}</div>`:''}
        ${item.n?`<div class="ci-note">ℹ ${item.n}</div>`:''}
      </div>
    </div>`;
  }).join('');
  const note=r.note?`<div class="sc-note">↳ ${r.note}</div>`:'';
  return`<div class="sc">
    <div class="sc-hdr" onclick="toggleSec('${rid}')">
      <div class="sc-ico">${r.icon}</div>
      <div class="sc-info">
        <div class="sc-title">${r.name}</div>
        <div class="sc-count">${done}/${total} complete</div>
        ${note}
      </div>
      <span class="badge ${pct===100&&total>0?'badge-gold':'badge-red'}">${pct}%</span>
      <div class="chev${isOpen?' open':''}" id="cv-${rid}">▼</div>
    </div>
    <div class="sc-bar"><div class="sc-fill" style="width:${pct}%"></div></div>
    <div class="items" id="it-${rid}" style="display:${isOpen?'block':'none'}">${ihtml}</div>
  </div>`;
}

function rModal(){
  if(S.modal!=='newShow')return'';
  const ns=S.ns,step=ns.step;
  let body='',nextLbl='',backLbl='';
  if(step===1){
    nextLbl='Next: Select Routines →';backLbl='Cancel';
    body=`<div class="step-ind">Step 1 of 3 — Show Info</div>
      <div class="fg"><label class="flbl">Show Name *</label>
        <input class="finput" placeholder="e.g. Corporate Gala, Birthday Party..." value="${ns.name.replace(/"/g,'&quot;')}" oninput="S.ns.name=this.value">
      </div>
      <div class="fg"><label class="flbl">Venue (optional)</label>
        <input class="finput" placeholder="e.g. The Marriott Downtown" value="${ns.venue.replace(/"/g,'&quot;')}" oninput="S.ns.venue=this.value">
      </div>
      <div class="fg"><label class="flbl">Date (optional)</label>
        <input class="finput" type="date" value="${ns.date}" oninput="S.ns.date=this.value">
      </div>`;
  } else if(step===2){
    nextLbl='Next: Arrange Order →';backLbl='← Back';
    const opts=Object.values(RD).map(r=>`
      <div class="roption${ns.selected.includes(r.id)?' sel':''}" onclick="nsToggle('${r.id}')">
        <div class="roption-cb"><span class="ck" style="${ns.selected.includes(r.id)?'display:block':'display:none'}">✓</span></div>
        <span class="roption-ico">${r.icon}</span><span class="roption-name">${r.name}</span>
      </div>`).join('');
    body=`<div class="step-ind">Step 2 of 3 — Select Routines (${ns.selected.length} selected)</div><div class="rselector">${opts}</div>`;
  } else {
    nextLbl='✦ Create Show';backLbl='← Back';
    const ord=ns.order.filter(id=>ns.selected.includes(id));
    const rhtml=ord.map((id,i)=>{
      const r=RD[id];
      return`<div class="ritem">
        <span>${r.icon}</span><span class="ritem-name">${r.name}</span>
        <button class="rarrow" ${i===0?'disabled':''} onclick="nsMove('${id}',-1)">↑</button>
        <button class="rarrow" ${i===ord.length-1?'disabled':''} onclick="nsMove('${id}',1)">↓</button>
      </div>`;
    }).join('');
    body=`<div class="step-ind">Step 3 of 3 — Arrange Performance Order</div><div class="rlist">${rhtml}</div>`;
  }
  return`<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-hdr">
        <div class="modal-title">✦ Build New Show</div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">${body}</div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="nsBack()">${backLbl}</button>
        <button class="btn btn-primary" onclick="nsNext()">${nextLbl}</button>
      </div>
    </div>
  </div>`;
}

function doCheck(sid,tab,key){const c=chks(sid,tab);c[key]=!c[key];save();render();}
function goNav(v){S.view=v;S.activeRoutine=null;if(v!=='show-detail')openSec={};save();render();}
function openShow(id){S.activeShow=id;S.view='show-detail';S.showTab='setup';openSec={};render();}
function setTab(tab){S.showTab=tab;openSec={};render();}
function setFilter(f){S.filter=f;render();}
function saveNote(sid,val){S.notes[sid]=val;save();}
function resetChecks(sid){if(confirm('Reset all checks for this show?')){S.checks[sid]={};save();render();}}
function delShow(id){if(confirm('Delete this show?')){S.shows=S.shows.filter(s=>s.id!==id);if(S.activeShow===id){S.view='shows';S.activeShow=null;}save();render();}}
function togglePrep(id){const p=S.prep.find(x=>x.id===id);if(p){p.done=!p.done;save();render();}}
function delPrep(id){S.prep=S.prep.filter(x=>x.id!==id);save();render();}
function addPrep(){
  const text=(S.np.text||'').trim();if(!text)return;
  S.prep.push({id:'p'+Date.now(),text,cat:S.np.cat||'find',done:false});
  S.np.text='';save();render();
}
function openModal(){S.modal='newShow';S.ns={step:1,name:'',venue:'',date:'',selected:[...DEFAULT_ORDER],order:[...DEFAULT_ORDER]};render();}
function closeModal(){S.modal=null;render();}
function nsToggle(id){
  const ns=S.ns;
  if(ns.selected.includes(id)){ns.selected=ns.selected.filter(x=>x!==id);ns.order=ns.order.filter(x=>x!==id);}
  else{ns.selected.push(id);ns.order.push(id);}
  render();
}
function nsMove(id,dir){
  const o=S.ns.order,i=o.indexOf(id),ni=i+dir;
  if(ni<0||ni>=o.length)return;
  [o[i],o[ni]]=[o[ni],o[i]];render();
}
function nsNext(){
  const ns=S.ns;
  if(ns.step===1){if(!ns.name.trim()){alert('Please enter a show name.');return;}ns.step=2;render();}
  else if(ns.step===2){if(!ns.selected.length){alert('Please select at least one routine.');return;}ns.order=ns.order.filter(id=>ns.selected.includes(id));ns.selected.forEach(id=>{if(!ns.order.includes(id))ns.order.push(id);});ns.step=3;render();}
  else{
    const newShow={id:'show-'+Date.now(),name:ns.name,venue:ns.venue,date:ns.date,routineOrder:ns.order.filter(id=>ns.selected.includes(id)),featured:false,createdAt:new Date().toISOString()};
    S.shows.push(newShow);closeModal();openShow(newShow.id);save();
  }
}
function nsBack(){if(S.ns.step===1)closeModal();else{S.ns.step--;render();}}

// ================================================================
// RENDER
// ================================================================
function render(){
  document.querySelectorAll('.nav-btn').forEach(btn=>{
    const v=btn.dataset.v;
    btn.classList.toggle('active',
      (v==='shows'&&(S.view==='shows'||S.view==='show-detail'))||
      (v==='routines'&&S.view==='routines')||(v==='prep'&&S.view==='prep')
    );
  });
  const main=document.getElementById('main');
  if(S.view==='shows')main.innerHTML=vShows();
  else if(S.view==='show-detail')main.innerHTML=vShowDetail();
  else if(S.view==='routines')main.innerHTML=vRoutines();
  else if(S.view==='prep')main.innerHTML=vPrep();
  document.getElementById('mroot').innerHTML=rModal();
}

render();
</script>
</body>
